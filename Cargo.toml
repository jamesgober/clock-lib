[package]
name = "clock-lib"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
readme = "README.md"
license = "Apache-2.0 OR MIT"
authors = ["James Gober <me@jamesgober.com>"]
description = "Monotonic and wall-clock time readings for Rust, with a mockable clock for deterministic testing. Simple Tier-1 API, zero dependencies, no unsafe."
keywords = ["time", "clock", "monotonic", "timekeeping", "mock"]
categories = ["date-and-time", "development-tools::testing", "no-std"]
documentation = "https://docs.rs/clock-lib"
repository = "https://github.com/jamesgober/clock-lib"
homepage = "https://github.com/jamesgober/clock-lib"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "clock_lib"
path = "src/lib.rs"

[features]
default = ["std"]
std = []

[dev-dependencies]
# Benchmark harness (dev-only, never built by downstream users). 0.7 is the
# newest line compatible with MSRV 1.85 (0.8 needs 1.86). Default features are
# off: rayon and plotters are not needed for text reports, and dropping them
# removes the crossbeam/plotters/wasm-bindgen subtree from the dev graph.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "clock_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"